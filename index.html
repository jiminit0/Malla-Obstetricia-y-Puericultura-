
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Malla Obstetricia - Helena Meléndez</title>
  <style>
    body {
      background-color: white;
      font-family: sans-serif;
      margin: 0;
      padding: 2rem;
    }
    h1 {
      color: #7b1e1e;
      text-align: center;
    }
    .semestre {
      border: 2px solid #d9a3a3;
      border-radius: 10px;
      padding: 1rem;
      margin-bottom: 2rem;
    }
    .semestre h2 {
      color: #9e1d1d;
    }
    .ramo {
      padding: 0.5rem;
      margin: 0.3rem 0;
      border-radius: 5px;
      background-color: #f8d7da;
      cursor: pointer;
    }
    .ramo.aprobado {
      background-color: #c64444;
      color: white;
      text-decoration: line-through;
    }
    .ramo.bloqueado {
      background-color: #cccccc;
      color: #666;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <h1>Malla de Obstetricia - Hecho por Helena Meléndez</h1>
  <div id="malla"></div>

  <script>
    const malla = [
      {
        semestre: "1º Semestre",
        ramos: [
          { nombre: "ANTROPOLOGÍA", req: [] },
          { nombre: "BIOLOGÍA CELULAR Y GENÉTICA", req: [] },
          { nombre: "SALUD PÚBLICA", req: [] },
          { nombre: "FUNDAMENTOS DE ENFERMERÍA", req: [] },
          { nombre: "ANATOMÍA GENERAL", req: [] },
          { nombre: "ÉTICA", req: [] }
        ]
      },
      {
        semestre: "2º Semestre",
        ramos: [
          { nombre: "BIOQUÍMICA", req: ["BIOLOGÍA CELULAR Y GENÉTICA"] },
          { nombre: "PSICOLOGÍA GENERAL", req: [] },
          { nombre: "SOCIOLOGÍA", req: ["ANTROPOLOGÍA"] },
          { nombre: "ANATOMÍA ESPECIAL", req: ["ANATOMÍA GENERAL"] },
          { nombre: "ENFERMERÍA CLÍNICA", req: ["FUNDAMENTOS DE ENFERMERÍA"] }
        ]
      }
    ];

    const estado = {};

    function renderMalla() {
      const container = document.getElementById("malla");
      container.innerHTML = "";
      malla.forEach((sem) => {
        const semDiv = document.createElement("div");
        semDiv.className = "semestre";
        const title = document.createElement("h2");
        title.textContent = sem.semestre;
        semDiv.appendChild(title);
        sem.ramos.forEach((ramo) => {
          const div = document.createElement("div");
          div.className = "ramo";
          div.textContent = ramo.nombre;

          const requisitosCumplidos = ramo.req.every((r) => estado[r]);

          if (ramo.req.length > 0 && !requisitosCumplidos) {
            div.classList.add("bloqueado");
          } else if (estado[ramo.nombre]) {
            div.classList.add("aprobado");
          }

          div.addEventListener("click", () => {
            if (div.classList.contains("bloqueado")) return;
            estado[ramo.nombre] = !estado[ramo.nombre];
            renderMalla();
          });

          semDiv.appendChild(div);
        });
        container.appendChild(semDiv);
      });
    }

    renderMalla();
  </script>
</body>
</html>
